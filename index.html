<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMK Repair">
<meta name="theme-color" content="#F2F2F7">
<title>CMK Laptop Repair</title>
<style>
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --text: #000; --text2: rgba(60,60,67,.6); --text3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18); --fill: rgba(120,120,128,.12);
    --accent: #6D28D9; --green: #34C759; --red: #FF3B30; --orange: #FF9500;
    --orange-bg: rgba(255,149,0,.16); --green-bg: rgba(52,199,89,.18);
    --nav: rgba(249,249,249,.86);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --card: #1C1C1E; --text: #fff; --text2: rgba(235,235,245,.6); --text3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.24); --accent: #A78BFA;
      --orange-bg: rgba(255,159,10,.22); --green-bg: rgba(48,209,88,.22); --nav: rgba(28,28,30,.86);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
  }
  button, input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  button { cursor: pointer; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; flex: none; }

  #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; }

  /* Nav */
  .nav { position: sticky; top: 0; z-index: 50; background: var(--nav);
         backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
         padding-top: var(--safe-t); border-bottom: .5px solid transparent; transition: border-color .2s; }
  .nav.scrolled { border-bottom-color: var(--sep); }
  .nav-bar { height: 44px; display: flex; align-items: center; justify-content: center; }
  .nav-title { font-size: 17px; font-weight: 600; opacity: 0; transition: opacity .2s; }
  .nav.scrolled .nav-title { opacity: 1; }

  /* Views */
  .view { display: none; padding-bottom: calc(49px + var(--safe-b) + 32px); }
  .view.on { display: block; animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .large { padding: 4px 16px 8px; }
  .large h1 { font-size: 34px; font-weight: 700; letter-spacing: .37px; line-height: 1.1; }
  .large p { color: var(--text2); font-size: 15px; margin-top: 6px; line-height: 1.35; }

  /* Form groups */
  .form-h { font-size: 13px; text-transform: uppercase; color: var(--text2); padding: 20px 32px 6px; }
  .form-f { font-size: 13px; color: var(--text2); padding: 6px 32px 0; line-height: 1.35; }
  .group { background: var(--card); margin: 0 16px; border-radius: 10px; overflow: hidden; }
  .frow { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; border-bottom: .5px solid var(--sep); }
  .frow:last-child { border-bottom: 0; }
  .flabel { font-size: 17px; width: 92px; flex: none; }
  .flabel.wide { width: auto; flex: 1; }
  .frow input[type="text"], .frow input[type="tel"], .frow input[type="datetime-local"] {
    flex: 1; min-width: 0; text-align: right; font-size: 17px; padding: 12px 0; color: var(--text);
  }
  .frow input::placeholder, .area::placeholder { color: var(--text3); }
  .area { display: block; width: 100%; min-height: 96px; padding: 12px 16px; font-size: 17px; resize: none;
          line-height: 1.35; border-bottom: .5px solid var(--sep); }
  .area:last-child { border-bottom: 0; }

  /* Service options (checklist) */
  .opt { display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-bottom: .5px solid var(--sep); font-size: 17px; cursor: pointer; }
  .opt:last-child { border-bottom: 0; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .tick { margin-left: auto; color: var(--accent); opacity: 0; width: 20px; height: 20px; stroke-width: 2.6; }
  .opt input:checked ~ .tick { opacity: 1; }

  /* Switch */
  .switch { position: relative; width: 51px; height: 31px; margin-left: auto; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 31px; background: var(--fill); transition: background .25s; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
                     background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15); transition: transform .25s cubic-bezier(.32,.72,0,1); }
  .switch input:checked + i { background: var(--green); }
  .switch input:checked + i::after { transform: translateX(20px); }

  /* Photo */
  .photo-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .photo-prev { position: relative; width: 88px; height: 88px; border-radius: 10px; overflow: hidden; flex: none; }
  .photo-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
             background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 22px; text-align: center; }
  .photo-add { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 17px; cursor: pointer; }
  .photo-add svg { width: 20px; height: 20px; }
  .photo-add input { display: none; }

  /* Primary button */
  .cta { display: block; width: calc(100% - 32px); margin: 28px 16px 0; height: 50px; border-radius: 12px;
         background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; }
  .cta:active { opacity: .85; }
  .cta:disabled { opacity: .5; }

  /* Requests list */
  .section-h { font-size: 13px; text-transform: uppercase; color: var(--text2); padding: 20px 32px 6px; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; border-bottom: .5px solid var(--sep); }
  .row:last-child { border-bottom: 0; }
  .r-main { flex: 1; min-width: 0; }
  .r-name { font-size: 17px; font-weight: 500; letter-spacing: -.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-sub { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--orange-bg); color: var(--orange); flex: none; }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .empty { text-align: center; padding: 56px 28px; color: var(--text2); }
  .empty svg { width: 44px; height: 44px; color: var(--text3); margin-bottom: 10px; }
  .empty h3 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .empty p { font-size: 15px; line-height: 1.35; }

  /* Tab bar */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-width: 520px; margin: 0 auto;
          height: calc(49px + var(--safe-b)); padding-bottom: var(--safe-b); display: flex; background: var(--nav);
          backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
          border-top: .5px solid var(--sep); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
         font-size: 10px; font-weight: 500; color: var(--text3); }
  .tab svg { width: 26px; height: 26px; }
  .tab.on { color: var(--accent); }

  /* Sheets & alerts */
  .modal { position: fixed; inset: 0; z-index: 300; pointer-events: none; }
  .modal.open { pointer-events: auto; }
  .modal .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; }
  .modal.open .scrim { opacity: 1; }
  .modal .panel { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px; max-height: 92dvh;
                  display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
                  border-radius: 14px 14px 0 0; padding-bottom: var(--safe-b);
                  transform: translateY(102%); transition: transform .38s cubic-bezier(.32,.72,0,1); }
  .modal.open .panel { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--text3); margin: 8px auto 0; flex: none; }
  .sheet-body { padding: 24px 20px 20px; text-align: center; overflow-y: auto; }
  .ok-icon { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; background: var(--green-bg);
             color: var(--green); display: grid; place-items: center; }
  .ok-icon svg { width: 30px; height: 30px; stroke-width: 2.6; }
  .sheet-body h2 { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .ref { display: inline-block; margin: 10px 0 8px; padding: 6px 14px; border-radius: 8px; background: var(--fill);
         font-size: 20px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .sheet-body p { color: var(--text2); font-size: 15px; line-height: 1.4; }
  .sheet-btns { padding: 0 16px; display: grid; gap: 8px; margin-top: 20px; }
  .btn-sec { height: 48px; border-radius: 12px; background: var(--card); color: var(--accent); font-size: 17px; font-weight: 600; }
  .modal.center .panel { top: 50%; bottom: auto; left: 50%; right: auto; width: 270px; max-width: 86vw; margin: 0;
                         max-height: none; border-radius: 14px; padding: 0; background: var(--card);
                         transform: translate(-50%, -50%) scale(.92); opacity: 0; transition: transform .25s, opacity .25s; }
  .modal.center.open .panel { transform: translate(-50%, -50%); opacity: 1; }
  .alert-head { padding: 20px 16px 18px; text-align: center; }
  .alert-head h4 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .alert-head p { font-size: 13px; color: var(--text2); }
  .alert-btns { display: flex; border-top: .5px solid var(--sep); }
  .alert-btn { flex: 1; padding: 11px 0; font-size: 17px; color: var(--accent); }
  .alert-btn + .alert-btn { font-weight: 600; border-left: .5px solid var(--sep); }
</style>
</head>
<body>
<div id="app">

  <header class="nav" id="nav">
    <div class="nav-bar"><div class="nav-title" id="navTitle">CMK Laptop Repair</div></div>
  </header>

  <main>
    <!-- New request -->
    <section class="view on" id="v-new">
      <div class="large">
        <h1>CMK Laptop Repair</h1>
        <p>Tell us what's wrong and where you are. We'll confirm your booking and get back to you.</p>
      </div>

      <form id="form" novalidate>
        <div class="form-h">Your details</div>
        <div class="group">
          <label class="frow"><span class="flabel">Name</span><input type="text" name="name" required placeholder="Required" autocomplete="name"></label>
          <label class="frow"><span class="flabel">Phone</span><input type="tel" name="phone" required placeholder="Required" autocomplete="tel"></label>
          <label class="frow"><span class="flabel">Location</span><input type="text" name="location" required placeholder="Address or area" autocomplete="street-address"></label>
        </div>

        <div class="form-h">Describe the problem</div>
        <div class="group">
          <textarea class="area" name="description" required placeholder="What's happening? Include make and model if you know it."></textarea>
        </div>

        <div class="form-h">Photo (optional)</div>
        <div class="group">
          <div class="photo-row">
            <div id="photoPrev" class="photo-prev" hidden>
              <img id="photoImg" alt="Problem photo">
              <button class="photo-x" id="photoRm" type="button" aria-label="Remove photo">×</button>
            </div>
            <label class="photo-add"><span data-ic="plus"></span><span>Add photo</span><input type="file" id="fPhoto" accept="image/*"></label>
          </div>
        </div>

        <div class="form-h">Schedule</div>
        <div class="group">
          <label class="frow"><span class="flabel">Preferred</span><input type="datetime-local" name="preferred"></label>
        </div>

        <button class="cta" type="submit" id="sendBtn">Send request</button>
      </form>
    </section>

    <!-- My requests -->
    <section class="view" id="v-mine">
      <div class="large">
        <h1>My requests</h1>
        <p>Requests you've sent from this device.</p>
      </div>
      <div id="mineList"></div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab on" data-tab="new"><span data-ic="plus"></span><span>New request</span></button>
    <button class="tab" data-tab="mine"><span data-ic="list"></span><span>My requests</span></button>
  </nav>

  <!-- Success sheet -->
  <div class="modal" id="ok">
    <div class="scrim"></div>
    <div class="panel">
      <div class="grab"></div>
      <div class="sheet-body">
        <div class="ok-icon"><span data-ic="check"></span></div>
        <h2>Request sent</h2>
        <div class="ref" id="okRef">SF-0000</div>
        <p id="okMsg"></p>
      </div>
      <div class="sheet-btns"><button class="btn-sec" id="okMine" type="button">View my requests</button></div>
    </div>
  </div>

  <!-- Alert -->
  <div class="modal center" id="alert">
    <div class="scrim"></div>
    <div class="panel">
      <div class="alert-head"><h4 id="alertTitle"></h4><p id="alertMsg"></p></div>
      <div class="alert-btns" id="alertBtns"></div>
    </div>
  </div>

</div>

<script>
/* Supabase connection. Requests are saved to the repair_requests table. */
const CONFIG = {
  supabaseUrl: 'https://phcjncjdgqdltiyesvfw.supabase.co',
  supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoY2puY2pkZ3FkbHRpeWVzdmZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTk4MDIsImV4cCI6MjEwNjE3NTgwMn0.GUbvA_fV289ccSg4U-Kgl9EtekjYOjaJirwPX_GQG54',
  table: 'repair_requests'
};
const KEY = 'sf_client_requests';

const P = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>'
};
const I = Object.fromEntries(Object.entries(P).map(([k, v]) => [k, `<svg viewBox="0 0 24 24" aria-hidden="true">${v}</svg>`]));
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let mine = load();
let pendingPhoto = null;

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function saveMine() { try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (e) {} }
function refCode() {
  return 'CMK-' + Math.random().toString(36).slice(2, 6).toUpperCase() + Date.now().toString(36).slice(-3).toUpperCase();
}

/* ---------- Modals ---------- */
function openModal(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  if (!$$('.modal.open').length) document.body.style.overflow = '';
}
function ask(title, msg, ok) {
  return new Promise(resolve => {
    $('#alertTitle').textContent = title;
    $('#alertMsg').textContent = msg;
    $('#alertBtns').innerHTML = `<button class="alert-btn" data-r="0">Cancel</button><button class="alert-btn" data-r="1">${esc(ok)}</button>`;
    $('#alertBtns').onclick = e => {
      const b = e.target.closest('[data-r]');
      if (!b) return;
      closeModal('alert');
      resolve(b.dataset.r === '1');
    };
    openModal('alert');
  });
}
function alertOnly(title, msg) {
  $('#alertTitle').textContent = title;
  $('#alertMsg').textContent = msg;
  $('#alertBtns').innerHTML = `<button class="alert-btn" data-r="1">OK</button>`;
  $('#alertBtns').onclick = () => closeModal('alert');
  openModal('alert');
}

/* ---------- Photo ---------- */
function showPhoto(src) {
  $('#photoImg').src = src || '';
  $('#photoPrev').hidden = !src;
}
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
$('#fPhoto').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    pendingPhoto = await compressImage(f);
    showPhoto(pendingPhoto);
  } catch (err) {
    alertOnly('Photo not added', 'Please try a different image.');
  }
  e.target.value = '';
});
$('#photoRm').addEventListener('click', () => { pendingPhoto = null; showPhoto(null); });

/* ---------- Submit ---------- */
const form = $('#form');
const sendBtn = $('#sendBtn');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(form);
  const name = (fd.get('name') || '').trim();
  const phone = (fd.get('phone') || '').trim();
  const location = (fd.get('location') || '').trim();
  const description = (fd.get('description') || '').trim();
  if (!name || !phone || !location || !description) {
    alertOnly('Missing details', 'Please fill in your name, phone, location and a description of the problem.');
    return;
  }

  const req = {
    ref: refCode(),
    name, phone, location, description,
    service: 'Laptop repair',
    preferred: fd.get('preferred') || '',
    charge: false,
    photo: pendingPhoto || '',
    status: 'received',
    createdAt: new Date().toISOString()
  };

  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending…';
  try {
    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${CONFIG.table}`, {
      method: 'POST',
      headers: {
        apikey: CONFIG.supabaseAnonKey,
        Authorization: 'Bearer ' + CONFIG.supabaseAnonKey,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({
        ref: req.ref, name: req.name, phone: req.phone, location: req.location,
        description: req.description, service: req.service, preferred: req.preferred || null,
        photo: req.photo || null, status: 'received', created_at: req.createdAt
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    mine.unshift(req);
    saveMine();
    resetForm();
    showSuccess(req);
    renderMine();
  } catch (err) {
    alertOnly('Couldn\'t send', 'Check your connection and try again. Your details are still filled in.');
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send request';
  }
});

function resetForm() {
  form.reset();
  pendingPhoto = null;
  showPhoto(null);
}

function showSuccess(req) {
  $('#okRef').textContent = req.ref;
  $('#okMsg').textContent = `We'll call ${req.phone} to confirm your CMK laptop repair.`;
  openModal('ok');
}
$('#okMine').addEventListener('click', () => { closeModal('ok'); go('mine'); });

/* ---------- My requests ---------- */
function renderMine() {
  const host = $('#mineList');
  if (!mine.length) {
    host.innerHTML = `<div class="empty">${'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>'}<h3>No requests yet</h3><p>Requests you send from this device will appear here.</p></div>`;
    return;
  }
  host.innerHTML = `<div class="group" style="margin-top:12px">${mine.map(r => {
    const when = new Date(r.createdAt).toLocaleString('en-US', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    return `
      <div class="row">
        <div class="r-main">
          <div class="r-name">${esc(r.service)} · ${esc(r.ref)}</div>
          <div class="r-sub">${esc(r.location)} · ${when}</div>
        </div>
        <span class="pill">Received</span>
      </div>`;
  }).join('')}</div>`;
}

/* ---------- Tabs & nav ---------- */
function go(tab) {
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  $('#v-new').classList.toggle('on', tab === 'new');
  $('#v-mine').classList.toggle('on', tab === 'mine');
  $('#navTitle').textContent = tab === 'new' ? 'CMK Laptop Repair' : 'My requests';
  window.scrollTo(0, 0);
  if (tab === 'mine') renderMine();
}
$$('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.tab)));
window.addEventListener('scroll', () => $('#nav').classList.toggle('scrolled', window.scrollY > 8), { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.modal.open').forEach(m => m.id !== 'alert' && closeModal(m.id)); });

/* ---------- Boot ---------- */
$$('[data-ic]').forEach(el => { el.innerHTML = I[el.dataset.ic]; });
renderMine();
</script>
</body>
</html>
